<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Resume Screening System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    padding:0;
    background:linear-gradient(135deg,#0d6efd,#6f42c1);
    font-family:'Segoe UI',sans-serif;
    min-height:100vh;
}

.main-card{
    margin-top:40px;
    border:none;
    border-radius:20px;
}

.upload-box{
    border:3px dashed #0d6efd;
    border-radius:15px;
    padding:35px;
    text-align:center;
    background:#f8f9fa;
    transition:.3s;
    cursor:pointer;
}

.upload-box:hover{
    background:#eef4ff;
    transform:scale(1.02);
}

.upload-icon{
    font-size:50px;
    color:#0d6efd;
    margin-bottom:15px;
}

.btn-upload{
    font-size:18px;
    padding:12px;
}

.file-list{
    margin-top:10px;
    font-size:14px;
    color:#555;
}

.title{
    color:white;
    text-align:center;
    margin-top:30px;
}

.subtitle{
    color:white;
    opacity:.9;
    text-align:center;
    margin-bottom:25px;
}

</style>

</head>

<body>

<div class="container">

<h1 class="title">
<i class="fa-solid fa-robot"></i>
AI Resume Screening System
</h1>

<p class="subtitle">
Upload resumes and a job description to rank candidates using AI.
</p>

<div class="card shadow-lg main-card">

<div class="card-body p-5">

<form action="/upload" method="POST" enctype="multipart/form-data">

<div class="row">

<div class="col-md-6 mb-4">

<label class="form-label fw-bold">

Resume Files

</label>

<div class="upload-box">

<div class="upload-icon">

<i class="fa-solid fa-file-lines"></i>

</div>

<input
type="file"
class="form-control"
name="resumes"
id="resumeInput"
multiple
required>

<div
id="resumeFiles"
class="file-list">

No files selected

</div>

</div>

</div>

<div class="col-md-6 mb-4">

<label class="form-label fw-bold">

Job Description

</label>

<div class="upload-box">

<div class="upload-icon">

<i class="fa-solid fa-briefcase"></i>

</div>

<input
type="file"
class="form-control"
name="job_description"
id="jobInput"
required>

<div
id="jobFile"
class="file-list">

No file selected

</div>

</div>

</div>

</div>

<div class="text-center mt-4">

<button
type="submit"
class="btn btn-primary btn-lg btn-upload">

<i class="fa-solid fa-magnifying-glass"></i>

Analyze Resumes

</button>

</div>

</form>

</div>

</div>

</div>

<script>

const resumeInput=document.getElementById("resumeInput");

resumeInput.addEventListener("change",function(){

let names=[];

for(let i=0;i<this.files.length;i++){

names.push(this.files[i].name);

}

document.getElementById("resumeFiles").innerHTML=names.join("<br>");

});

const jobInput=document.getElementById("jobInput");

jobInput.addEventListener("change",function(){

if(this.files.length>0){

document.getElementById("jobFile").innerHTML=this.files[0].name;

}

});

</script>

</body>

</html>
